# Claudometer configuration — OPTIONAL.
# Tip: the in-app Settings panel (⚙ in the popover) edits all of this for you —
# you rarely need to touch this file by hand.
# Copy to  ~/.claudometer.toml  (or set CLAUDOMETER_CONFIG=/path/to/file).
# Everything has a sensible default; delete any line to use it. Hand-edits apply
# on restart; changes made in the settings panel apply immediately.

# Seconds between usage polls (clamped to 60–300).
poll = 90

# "auto" follows your taskbar's light/dark; force with "light" or "dark".
theme = "auto"

# Which meters to show on the taskbar strip: any of "session", "weekly".
# (The live-session count is controlled separately, by sessions_on_strip below.)
metrics = ["session", "weekly"]

# Hide the widget while a fullscreen app (movie, game, presentation) is active,
# like the taskbar does. Set to false to keep it always visible, even fullscreen.
hide_on_fullscreen = true

# Desktop toast alerts when you cross a usage threshold (upward).
alerts = true
alert_thresholds = [80, 90]

# Show an estimated token/cost line in the popover (reads local Claude Code
# session logs; estimate only — see the README). This also adds a "Today by
# project" breakdown to the tray / menu-bar menus, so you can see which repo
# is actually burning the usage.
show_cost = false

# Override the accent color (brand mark, badge, links). Hex string, e.g.:
# accent = "#d97757"

# --- Resume when your 5-hour session limit resets -------------------------
# Tier 1 (safe, default): when the window resets, show a one-click "Resume"
# notification that opens a terminal in your session's folder to continue.
resume_notify = true

# Tier 2 (opt-in, RISKY): automatically resume UNATTENDED at reset — it can make
# changes with no one watching. Off by default. Read the README before enabling.
resume_auto = false
resume_prompt = "Continue where you left off."   # what Tier 2 tells Claude
resume_max_turns = 30                             # Tier 2: cap agentic turns
# resume_skip_permissions = false   # true = --dangerously-skip-permissions
#                                   # (default false uses the safer acceptEdits mode)

# --- Live Claude Code sessions --------------------------------------------
# Shows every running `claude` CLI session and what it's doing: working, done
# (waiting for your next prompt), or blocked on you. Read locally from
# ~/.claude/sessions — nothing is sent anywhere.
sessions = true

# Rows shown in the popover before the rest collapse into a "+N more" line.
# Clamped to 1–12: past 12 the popover grows taller than a small laptop screen.
sessions_max_rows = 6

# Also show a "Live N" count on the taskbar strip (the popover always lists
# them in full). Turn off if you only want the count when you open the details.
sessions_on_strip = true

# Toast when a session changes state. Which ones, any of:
#   "waiting"  it just became blocked on you (permission prompt, question)
#   "idle"     it just finished and is ready for your next prompt
#   "stuck"    it has been blocked on you for sessions_stuck_minutes
#   "gone"     the session ended
# "busy"/"shell" are deliberately not offered — they fire constantly during
# normal work and would train you to ignore the toasts.
sessions_alerts = true
sessions_alert_on = ["waiting", "idle", "stuck"]

# Nudge again when a session has been blocked this many minutes. 0 = never.
sessions_stuck_minutes = 10

# Don't toast about the terminal window you're currently looking at. Note this
# is per-WINDOW, not per-tab: several sessions often share one terminal.
sessions_quiet_foreground = true

# Instant alerts via Claude Code hooks, instead of waiting for the next poll.
# Turning this ON edits ~/.claude/settings.json to register four hooks
# (Notification, Stop, SessionStart, SessionEnd). The app shows you the exact
# JSON and asks first, backs the file up, and removes its entries cleanly when
# you turn it off. Off by default; without it sessions still update every
# second or so from ~/.claude/sessions.
#
# The hook runs a small relay copied to ~/.claudometer, NOT from the app
# folder, so updating or uninstalling Claudometer can never leave Claude Code
# invoking a path that no longer exists. If Claudometer stops running
# altogether, the relay notices after a week and removes the hooks, the spool
# and itself — so an uninstall tidies up even if you forget to switch this off
# first. Starting Claudometer again simply puts them back.
sessions_hooks = false

# Global shortcut that jumps to whichever session is waiting on you, from any
# application. Set to "" to turn it off. Windows only for now; if another app
# already owns the combination, Claudometer says so rather than failing quietly.
sessions_hotkey = "ctrl+alt+j"
